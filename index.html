<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Club House Menu</title>
    <!-- MODIFICADO: en Android, el favicon.ico no siempre cargaba. Dos causas típicas: (1)
         Chrome para Android prioriza PNG con "sizes" explícito y a veces ignora el .ico si va
         primero o es el único disponible en ese tamaño; (2) el navegador móvil cachea el
         favicon de forma mucho más agresiva que el resto de la página (a veces ignorando el
         max-age normal), así que un icono nuevo en la misma URL puede tardar en verse o no
         verse nunca. Se listan ahora varios PNG en tamaños estándar (con su propio ?v= de
         cache-busting — SI SE CAMBIA EL ICONO EN EL FUTURO, subir este número también) antes
         del .ico (que se deja solo como último recurso para navegadores muy antiguos), más el
         icono de iPhone/iPad y el manifest.json con los iconos que usa Android al añadir la
         web a la pantalla de inicio. -->
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#00748B">
    <link rel="shortcut icon" href="favicon.ico?v=2">
    <!-- NUEVO (28 agosto): igual que script.js, style.css necesita su propio ?v= de cache-busting
         — hasta ahora no lo tenía, así que un cambio de CSS podía tardar hasta 10 minutos en
         llegar al navegador del cliente aunque el archivo en GitHub ya fuera el nuevo. IMPORTANTE:
         cada vez que se suba un style.css nuevo, hay que subir también este número. -->
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body> 
    <header> 
        <div class="header-logos">
            <img src="logo-clubhouse.png" alt="Logo Club House" class="header-logo">
            <span id="header-menu-title"></span>
            <img src="negro.png" alt="Logo Negro" class="header-logo">
        </div>
        
        <div id="language-selector">
            <button id="btn-ES" onclick="changeLanguage('ES')" class="active">Español</button>
            <button id="btn-EN" onclick="changeLanguage('EN')">English</button>
            <button id="btn-DE" onclick="changeLanguage('DE')">Deutsch</button>
            <button id="btn-FR" onclick="changeLanguage('FR')">Français</button>
            <button id="btn-IT" onclick="changeLanguage('IT')">Italiano</button>
            <select id="more-langs" onchange="changeLanguage(this.value)">
                <option value="">🌐 Más...</option>
            </select>
        </div>
        <div class="category-wrapper"> 
            <nav id="category-selector"></nav> 
        </div> 
    </header>

    <main id="menu-container"> 
        <h2 id="current-category-name"></h2> 
        <div id="items-list">
            <div class="item-row skeleton-row">
                <div class="item-content">
                    <span class="skeleton-text line-70"></span>
                    <span class="skeleton-text line-40"></span>
                </div>
                <div class="price-box">
                    <span class="skeleton-text line-20"></span>
                </div>
            </div>
            <div class="item-row skeleton-row">
                <div class="item-content">
                    <span class="skeleton-text line-60"></span>
                    <span class="skeleton-text line-30"></span>
                </div>
                <div class="price-box">
                    <span class="skeleton-text line-20"></span>
                </div>
            </div>
            <div class="item-row skeleton-row">
                <div class="item-content">
                    <span class="skeleton-text line-50"></span>
                    <span class="skeleton-text line-40"></span>
                </div>
                <div class="price-box">
                    <span class="skeleton-text line-20"></span>
                </div>
            </div>
        </div> 
    </main>

    <div id="photo-modal" onclick="closeModal()"> 
        <span class="close-modal" onclick="closeModal()">&times;</span>  
        <button id="prev-btn" class="nav-btn" onclick="changePhoto(-1); event.stopPropagation();">❮</button>  
        <img id="modal-img" src="" alt="Vista previa" onclick="event.stopPropagation();">  
        <button id="next-btn" class="nav-btn" onclick="changePhoto(1); event.stopPropagation();">❯</button> 
    </div>

    <!-- NUEVO (26 agosto): ?v= de cache-busting en script.js — sin esto, el navegador (sobre
         todo en móvil) puede seguir sirviendo una copia antigua cacheada de script.js aunque el
         archivo en GitHub ya sea el nuevo, igual que ya pasaba con la imagen del vino "El
         Tenista" antes de que se le añadiera su propio ?v=. IMPORTANTE: cada vez que se suba un
         script.js nuevo, hay que subir también este número (basta con que cambie, no hace falta
         que coincida con APP_VERSION de dentro del script) — si no, esta protección no sirve de
         nada porque el navegador seguirá viendo la misma URL de siempre. -->
    <script src="script.js?v=1.5.0-clubhouse"></script>
</body>
</html>
